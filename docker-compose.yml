services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intellicloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./intellicloud-backend
      dockerfile: Dockerfile
    command: >
      gunicorn app:app
      --bind 0.0.0.0:5000
      --worker-class gthread
      --workers 2
      --threads 8
      --keep-alive 75
      --timeout 120
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./intellicloud-backend/secrets/firebase_sa.json:/run/secrets/firebase_sa.json:ro
      - ./intellicloud-backend/secrets/flask_secret_key.txt:/run/secrets/flask_secret_key.txt:ro
      - ./intellicloud-backend/data:/data:ro
    environment:
      FIREBASE_CREDENTIALS_JSON: /run/secrets/firebase_sa.json
      FLASK_SECRET_KEY_FILE: /run/secrets/flask_secret_key.txt
      GEOIP_CITY_DB: /data/GeoLite2-City.mmdb
      GEOIP_ASN_DB: /data/GeoLite2-ASN.mmdb
    depends_on:
      - redis
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2).read(); print('ok')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Frontend dev server (Vite)
  web:
    build:
      context: ./intellicloud-frontend
      target: dev
      args:
        VITE_INGEST_KEY: ${VITE_INGEST_KEY}
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./intellicloud-frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Sensor / ic_agent
  sensor:
    profiles: ["sensor"]
    build:
      context: ./intellicloud-backend/intellicloud-sensor
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      IC_API: http://backend:5000
      IC_CLIENT_KEY: ${IC_CLIENT_KEY}
      IC_IFACE: ${IC_IFACE:-eth0}
      IC_EMIT_MODE: important
      IC_VERIFY_TLS: "false"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

# Named volumes — declared at root level, separate from service bind mounts
volumes:
  postgres_data: