- id: inbound_admin_port
  when:
    detection_type: inbound_admin_port
  severity: high
  title: "Inbound admin port access attempt"
  actions:
    - type: log
    - type: alert

- id: port_scan
  when:
    detection_type: port_scan
  severity: high
  title: "Port scan detected"
  actions:
    - type: log
    - type: alert

- id: c2_indicator
  when:
    detection_type: c2_indicator
  severity: critical
  title: "Known C2 port traffic detected"
  actions:
    - type: log
    - type: alert

- id: beaconing
  when:
    detection_type: beaconing
  severity: medium
  title: "Possible C2 beaconing pattern"
  actions:
    - type: log
    - type: alert

- id: dns_anomaly
  when:
    detection_type: dns_length_anomaly
  severity: medium
  title: "DNS tunneling or DGA indicator"
  actions:
    - type: log